[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claimspec"
version = "0.1.0"
description = "Zero-dependency executable grounding contracts for research-agent traces"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "ClaimSpec contributors"}]
dependencies = []
keywords = ["grounding", "research", "verification", "citations", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/dnega-dev/ClaimSpec"
Repository = "https://github.com/dnega-dev/ClaimSpec"
Issues = "https://github.com/dnega-dev/ClaimSpec/issues"
Changelog = "https://github.com/dnega-dev/ClaimSpec/blob/main/CHANGELOG.md"

[project.scripts]
claimspec = "claimspec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
